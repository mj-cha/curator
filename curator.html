<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고수템 미니 웹앱 · 단백질 8종 · 피부 복구 · 노령견 · RTX 5000</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="bar">이 페이지는 쿠팡 파트너스 활동의 일환으로 일정액의 수수료를 제공받습니다 · 단점·주의사항 함께 기록</div>
  <div class="in">
    <div class="top-row">
      <span class="brand-tag">고수템 미니 웹앱</span>
      <div class="pbtns">
        <button class="pbtn" id="al-top">알림</button>
        <a class="pbtn" href="https://gosutem.com">본체 ↗</a>
        <button class="pbtn" id="sh">링크 복사</button>
      </div>
    </div>
    <div class="hdr">
      <h1 id="p-title"></h1>
      <p id="p-sub"></p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" class="tab" data-d="protein">단백질 8종</button>
      <button role="tab" class="tab" data-d="skin">피부짱 5종</button>
      <button role="tab" class="tab" data-d="pet">노령견</button>
      <button role="tab" class="tab" data-d="rtx">RTX 5000</button>
    </div>
    <label class="sb">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8E8B84" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="qi" placeholder="제품명·성분·사양 검색 (태광, 나우푸드, 퓨롯, 5070)">
    </label>
    <div id="detail-box"></div>
    <div id="top-ban"></div>
    <div id="chart-box"></div>
    <div id="secs-box" style="display:grid;gap:16px"></div>
    <div id="notes-box"></div>
    <footer class="foot">
      <span>고수템 미니 웹앱 (GOSUTEM) · 2026.11.24 기준</span>
      <span>실시간 판매가는 판매처 사정에 따라 변동될 수 있습니다</span>
    </footer>
  </div>
</div>

<div class="modal-bg" id="al-modal">
  <div class="modal">
    <h3 id="m-title">목표가 알림 설정</h3>
    <p id="m-sub" style="font-size:12px;color:#5E5B55"></p>
    <label style="font-size:12px;font-weight:700">희망 목표가 (원)</label>
    <input id="m-target" type="number" placeholder="예: 115000">
    <label style="font-size:12px;font-weight:700">알림 받을 이메일 또는 카톡 메모 (선택)</label>
    <input id="m-contact" type="text" placeholder="예: name@email.com">
    <div class="m-row">
      <button class="cbtn" id="m-cancel">취소</button>
      <button class="cbtn buy" id="m-save">목표가 저장</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="list-modal">
  <div class="modal">
    <h3>내 목표가 알림 목록</h3>
    <div id="al-list-body" class="al-list"></div>
    <button class="cbtn buy" id="l-close">닫기</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
