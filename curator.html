         tip:"노령견은 산책 시간이 줄어드는 대신 집 안에서 코로 냄새를 맡으며 간식을 찾는 ‘노즈워크’ 놀이가 치매 예방과 스트레스 해소에 중요합니다. 국내산 소고기 져키가 1.1kg 대용량(100g당 1,335원)으로 들어 있어 부담 없이 매트에 숨겨 주기 좋습니다.",
         warn:"사기 전 체크: 1.1kg 대용량 통이므로 개봉 후 공기가 통하지 않게 뚜껑을 꼭 닫아 보관하고, 강아지 체중별 하루 권장 급여량을 넘지 않게 조절해 주세요.",
         defOpt:0,
         sum:"쿠팡 14,680원(100g당 1,335원) · 다나와 비교 · 0원 제외",
         offers:[
           {k:"쿠팡 로켓배송 (1.1kg 대용량)",b:"100g당 1,335원 · 제휴",bCls:"aff",sub:"확인 기준가 14,680원 (26% 할인) · 로켓배송",p:14680,pTxt:"14,680원",u:MG,cta:"쿠팡 현재가"},
           {k:"다나와 판매처별 가격비교",b:"비제휴 실시간",bCls:"",sub:"오픈마켓 전체 실시간 최저가 비교",p:16500,pTxt:"다나와 최저가",u:DN("목우촌 멍수무강 1.1kg"),cta:"다나와 조회"},
           {k:"집에 있는 걸로 (기존 간식 보유 시)",b:"0원 대안",bCls:"used",sub:"집에 노즈워크 간식이 이미 있다면 0원으로 제외",p:0,pTxt:"0원",u:"",cta:"0원 선택"}
         ]}
      ],
      notes:[
        ["노령견 사료·간식 가격비교 팁","반려견 식품은 포장 단위에 따라 <em>100g당 단가가 30~50%까지 차이</em>납니다. 아침애 6.4kg 벌크(100g당 1,014원)처럼 개별 소포장된 대용량 박스를 고르면 신선도와 최저 단가를 동시에 챙길 수 있습니다."]
      ]
    }
  };

  var BAG_META={
    swim:{short:"수영 유튜버 5인 실물가방",order:0},
    skin:{short:"아현동 피부짱 5종",order:1},
    pet:{short:"16살 잭러셀 수제사료",order:2},
    rtx:{short:"선물용 RTX 5000",order:3}
  };
  var h=location.hash.slice(1);
  var mode=(h==="swim"||h==="rtx"||h==="skin"||h==="pet")?"bag":"all";
  var cur=DECKS[h]?h:"swim",q="",src=u=>u.indexOf("http")===0?u:"img/"+u;
  /* 기본 열림: RTX 탭은 MSI 지포스(r3, r2)만 열림, 다른 카드는 접힘 */
  var picks={swim:{sw0:0,sw1:0,sw2:0,sw3:0},rtx:{item:"r3",opt:0},skin:{s1:0,s2:0,s3:0,s4:0,s5:0},pet:{p1:0,p2:0,p3:0}};
  var openMap={sw0:true,sw1:true,sw2:false,sw3:false,r1:false,r3:true,r2:true,r4:false,s1:true,s2:false,s3:false,s4:false,s5:false,p1:true,p2:false,p3:false};

  function calcBar(d){
    if(d.singlePick){
      var st=picks[cur],it=d.items.find(x=>x.id===st.item)||d.items[0],o=it.offers[st.opt]||it.offers[0];
      var diff=Math.max(0,(it.refPrice||o.p)-o.p);
      return {tot:o.p,save:it.name.split(" ").slice(0,4).join(" ")+" · "+o.k+(diff>0?" (기준가 대비 -"+won(diff)+")":""),url:o.u||it.offers[0].u,cta:o.u?o.cta+" 열기 ↗":"다나와 시세 열기 ↗"};
    }
    var tot=0,firstUrl="";
    d.items.forEach(it=>{
      var idx=picks[cur][it.id]??it.defOpt,o=it.offers[idx]||it.offers[0];
      tot+=o.p||0;
      if(!firstUrl&&o.u&&o.p>0)firstUrl=o.u;
    });
    var sv=Math.max(0,(d.baseTotal||tot)-tot);
    return {tot:tot,save:d.baseLabel+" 대비 "+(sv>0?won(sv)+" 절약":"최저가 경로 선택 중"),url:firstUrl||d.items[0].offers[0].u,cta:"선택 판매처 열기 ↗"};
  }

  function renderAll(){
    $("p-title").textContent="고수템 전체 큐레이션 · 2열 실물 사진 타일 (16종)";
    $("p-sub").textContent="실제 수영 유튜버 5인 실물 가방·장비부터 아현동 피부짱·16살 잭러셀·선물용 RTX 5000까지, 2열 정사각 실물 사진 타일을 누르면 가방별 다채널 가격비교로 바로 이동합니다.";
    $("p-pills").innerHTML='<span class="mpill hi">전체 4개 가방 · 16종 실물</span><span class="mpill">개별 [제휴] 투명 표기</span><span class="mpill">0원 대안·중고 시세 포함</span>';
    $("anchor-box").innerHTML="";
    $("nobuy-box").innerHTML="";
    $("notes-box").innerHTML="";
    var orderKeys=["swim","skin","pet","rtx"],tiles=[];
    orderKeys.forEach(k=>{
      var d=DECKS[k];
      d.items.forEach(it=>{
        if(q&&(it.name+it.spec+it.tip+BAG_META[k].short+it.offers.map(o=>o.k+o.sub).join("")).toLowerCase().indexOf(q.toLowerCase())===-1)return;
        var primary=it.offers.find(o=>o.u)||it.offers[0];
        var isAff=primary.bCls==="aff"||primary.b.indexOf("제휴")>-1;
        tiles.push('<article class="atile"><div class="at-img" data-goto="'+k+':'+it.id+'"><span class="at-bag">'+BAG_META[k].short+'</span><img src="'+src(it.img)+'" alt="'+it.name+'"><span class="at-lbl'+(it.lblCls?' '+it.lblCls:'')+'">'+it.lbl.split("·")[0].trim()+'</span></div><div class="at-body"><h3 class="at-title" data-goto="'+k+':'+it.id+'">'+it.name+'</h3><div class="at-price"><span class="num">'+primary.pTxt+'</span>'+(isAff?'<span class="obadge aff">[제휴]</span>':'<span class="obadge">'+(primary.p===0?'0원 대안':'비제휴')+'</span>')+'</div><div class="at-actions"><button type="button" class="at-btn" data-goto="'+k+':'+it.id+'">가격비교 '+it.offers.length+'곳</button>'+(primary.u?'<a class="at-btn pri" href="'+primary.u+'" target="_blank" rel="noopener">'+primary.cta+' ↗</a>':'')+'</div></div></article>');
      });
    });
    $("secs-box").className="all-grid";
    $("secs-box").innerHTML=tiles.join("");
    $("cb-tot").textContent="전체 3개 가방 · 12개 검증 품목";
    $("cb-save").textContent="아래 가방 탭이나 타일의 [가격비교]를 눌러 최저가를 조합하세요";
    $("cb-go").href="#bag";
    $("cb-go").removeAttribute("target");
    $("cb-go").textContent="가방별 가격비교 보기 →";
    $("cb-go").onclick=e=>{e.preventDefault();mode="bag";render();};
    qa("[data-goto]").forEach(el=>el.onclick=()=>{
      var pts=el.getAttribute("data-goto").split(":"),k=pts[0],id=pts[1];
      mode="bag";cur=k;openMap[id]=true;
      if(history.replaceState)history.replaceState(null,"","#"+cur);
      render();
      setTimeout(()=>{var card=document.querySelector('[data-tog="'+id+'"]');if(card)card.scrollIntoView({behavior:"smooth",block:"center"});},60);
    });
  }

  function render(){
    qa("[data-mode]").forEach(x=>x.setAttribute("aria-selected",x.dataset.mode===mode));
    qa("[data-d]").forEach(x=>x.setAttribute("aria-selected",mode==="bag"&&x.dataset.d===cur));
    if(mode==="all"){renderAll();return;}
    $("secs-box").className="plist";
    $("cb-go").setAttribute("target","_blank");
    $("cb-go").onclick=null;
    var d=DECKS[cur]||DECKS.skin;
    $("p-title").textContent=d.title;$("p-sub").textContent=d.sub;
    $("p-pills").innerHTML=d.pills.map((p,i)=>'<span class="mpill'+(i===0?' hi':'')+'">'+p+'</span>').join("");
    var cb=calcBar(d);
    if(d.singlePick){
      var st=picks[cur],it=d.items.find(x=>x.id===st.item)||d.items[0],o=it.offers[st.opt]||it.offers[0];
      $("anchor-box").innerHTML='<div class="anchor"><div class="ac-col"><span>선택 모델 신품 기준가</span><s class="num">'+won(it.refPrice)+'</s><small>'+it.name.slice(0,22)+'</small></div><div class="ac-col"><span>내가 고른 경로 기준·예상가</span><b class="num">'+o.pTxt+'</b><small>'+o.k+'</small></div></div>';
    }else{
      var sv=Math.max(0,(d.baseTotal||cb.tot)-cb.tot);
      $("anchor-box").innerHTML='<div class="anchor"><div class="ac-col"><span>'+d.baseLabel+'</span><s class="num">'+won(d.baseTotal)+'</s><small>무작정 단품 풀세트 구매 시</small></div><div class="ac-col"><span>지금 내 고수 조합 총비용</span><b class="num">'+won(cb.tot)+'</b><small>'+(sv>0?'불필요 지출 -'+won(sv)+' 절약':'최저가 경로 선택 중')+'</small></div></div>';
    }
    $("nobuy-box").innerHTML='<div class="nobuy"><div class="nb-head"><b>먼저 빼고 시작할 것 (비추천 · 0원 대안)</b><span class="nb-step">제휴 링크 0개</span></div><div class="nb-list">'+d.nobuy.map(n=>'<div class="nb-item"><b>'+n[0]+'</b>'+n[1]+'<em>→ '+n[2]+'</em></div>').join("")+'</div></div>';

    var list=d.items.filter(it=>!q||(it.name+it.spec+it.tip+it.offers.map(o=>o.k+o.sub).join("")).toLowerCase().indexOf(q.toLowerCase())>-1);
    $("secs-box").innerHTML=list.map(it=>{
      var isItemOn=d.singlePick?picks[cur].item===it.id:true;
      var selIdx=d.singlePick?(isItemOn?picks[cur].opt:-1):(picks[cur][it.id]??it.defOpt);
      var isOpen=!!openMap[it.id];
      var qbar=it.qlinks?'<div class="qbar"><span>실시간 시세 직통:</span>'+it.qlinks.map(ql=>'<a class="qlink" href="'+ql[1]+'" target="_blank" rel="noopener">'+ql[0]+' ↗</a>').join("")+'</div>':'';
      return '<article class="pcard'+(isItemOn?' is-picked':'')+'"><div class="ptop"><div class="pi"><img src="'+src(it.img)+'" alt="'+it.name+'"></div><div class="pinfo"><div class="badges"><span class="lbl'+(it.lblCls?' '+it.lblCls:'')+'">'+it.lbl+'</span><span class="src-b">'+it.src+'</span></div><h3>'+it.name+'</h3><p class="pspec">'+it.spec+'</p></div></div><div class="ptip"><span class="ptip-who">'+(it.who||'고수 검증 의견')+'</span><p class="ptip-ctx">'+it.tip+'</p><em class="ptip-warn">'+it.warn+'</em></div><button type="button" class="ob-toggle'+(isOpen?' is-open':'')+'" data-tog="'+it.id+'" aria-expanded="'+isOpen+'"><div class="ob-tl"><b>어디서 살까요? · 가격·구매처 비교 ('+it.offers.length+'곳)</b><span>'+(it.sum||'')+'</span></div><span class="ob-tr">'+(isOpen?'가격비교 접기 ▴':'가격비교 열기 ▾')+'</span></button><div class="ob-body'+(isOpen?' is-open':'')+'"><div class="olist">'+it.offers.map((o,idx)=>{
        var on=selIdx===idx;
        return '<div class="orow'+(on?' on':'')+'"><div class="or-left" data-pick="'+it.id+':'+idx+'"><span class="or-rad"></span><div class="or-txt"><div class="or-title"><span>'+o.k+'</span><span class="obadge'+(o.bCls?' '+o.bCls:'')+'">'+o.b+'</span></div><span class="or-sub">'+o.sub+'</span></div></div><div class="or-right"><span class="or-price num">'+o.pTxt+'</span>'+(o.u?'<a class="or-go'+(o.bCls==='aff'?'':' sub')+'" href="'+o.u+'" target="_blank" rel="noopener">'+o.cta+' ↗</a>':'')+'</div></div>';
      }).join("")+'</div>'+qbar+'</div></article>';
    }).join("");

    $("notes-box").innerHTML='<div class="notes">'+d.notes.map(n=>'<div class="note"><b>'+n[0]+'</b>'+n[1]+'</div>').join("")+'</div>';
    $("cb-tot").textContent="내 선택 총비용 "+won(cb.tot);
    $("cb-save").textContent=cb.save;
    $("cb-go").href=cb.url;
    $("cb-go").textContent=cb.cta;

    qa("[data-tog]").forEach(btn=>btn.onclick=()=>{
      var id=btn.getAttribute("data-tog");
      openMap[id]=!openMap[id];
      render();
    });
    qa("[data-pick]").forEach(el=>el.onclick=()=>{
      var pts=el.getAttribute("data-pick").split(":"),id=pts[0],idx=+pts[1];
      if(d.singlePick){picks[cur]={item:id,opt:idx};}else{picks[cur][id]=idx;}
      openMap[id]=true;
      render();
    });
  }

  fetch("prices.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(p=>{
    if(p&&p.updatedAt)$("sync-stamp").textContent=p.updatedAt;
  }).catch(()=>{});

  qa("[data-mode]").forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode;
    if(history.replaceState)history.replaceState(null,"",mode==="all"?"#all":"#"+cur);
    render();
  });
  qa("[data-d]").forEach(b=>b.onclick=()=>{
    mode="bag";cur=b.dataset.d;
    if(history.replaceState)history.replaceState(null,"","#"+cur);
    render();
  });
  window.addEventListener("hashchange",()=>{
    var nh=location.hash.slice(1);
    if(nh==="all"){mode="all";render();}
    else if(DECKS[nh]){mode="bag";cur=nh;render();}
  });
  $("qi").oninput=e=>{q=e.target.value.trim();render();};
  $("sh").onclick=e=>{var b=e.currentTarget;if(navigator.clipboard)navigator.clipboard.writeText(location.origin+location.pathname+"#"+(mode==="all"?"all":cur));b.textContent="복사 완료";setTimeout(()=>b.textContent="가방 링크 복사",1400);};
  render();
})();</script>
</body>
</html>
