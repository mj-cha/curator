  qa("[data-d]").forEach(b=>b.onclick=()=>{cur=b.dataset.d;if(history.replaceState)history.replaceState(null,"","#"+cur);render();});
  window.addEventListener("hashchange",()=>{var nh=location.hash.slice(1);if(DECKS[nh]&&nh!==cur){cur=nh;render();}});
  $("qi").oninput=e=>{q=e.target.value.trim();render();};
  $("sh").onclick=e=>{var b=e.currentTarget;if(navigator.clipboard)navigator.clipboard.writeText(location.origin+location.pathname+"#"+cur);b.textContent="복사 완료";setTimeout(()=>b.textContent="링크 복사",1400);};
  render();
})();</script>
</body>
</html>
