<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고수템 미니 웹앱 · 단백질 · 피부 · 노령견 · RTX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="bar">쿠팡 파트너스 활동으로 일정액의 수수료를 제공받습니다 · 실물 라벨·단점 병기</div>
  <div class="in">
    <div class="top-row" data-block="top-header">
      <span class="brand-tag">고수템 미니 웹앱</span>
      <div class="pbtns">
        <button class="pbtn" id="al-top">알림</button>
        <button class="pbtn" id="fb-toggle">피드백 핀</button>
        <button class="pbtn" id="sh">링크</button>
      </div>
    </div>

    <div class="fb-bar" id="fb-bar">
      <span>수정할 영역을 클릭해 메모 (<b id="fb-cnt">0</b>건)</span>
      <button class="pbtn" id="fb-copy">피드백 복사</button>
    </div>

    <div class="hdr" data-block="page-title">
      <h1 id="p-title"></h1>
      <p id="p-sub"></p>
    </div>

    <div class="tabs" role="tablist" data-block="main-tabs">
      <button role="tab" class="tab" data-d="protein">단백질</button>
      <button role="tab" class="tab" data-d="skin">피부짱</button>
      <button role="tab" class="tab" data-d="pet">노령견</button>
      <button role="tab" class="tab" data-d="rtx">RTX</button>
    </div>

    <div class="chips" id="chips-box" data-block="category-chips"></div>

    <label class="sb" data-block="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8B84" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="qi" placeholder="제품명·성분 검색 (태광, 나우푸드, 퓨롯)">
    </label>

    <div id="detail-box"></div>
    <div id="chart-box"></div>
    <div id="nutri-box"></div>
    <div id="secs-box"></div>

    <footer class="foot">고수템 미니 웹앱 (GOSUTEM) · 2026.11.24 기준</footer>
  </div>
</div>

<div class="modal-bg" id="al-modal">
  <div class="modal">
    <h3 id="m-title">목표가 알림</h3>
    <p id="m-sub" style="font-size:11.5px;color:#5E5B55"></p>
    <div class="qchips">
      <button class="qchip" id="q-cur">현재가</button>
      <button class="qchip" id="q-5">-5%</button>
      <button class="qchip" id="q-10">-10%</button>
    </div>
    <input id="m-target" type="number" placeholder="희망가(원)">
    <div class="m-row">
      <button class="cbtn off" id="m-del" style="display:none">알림 해제</button>
      <button class="cbtn" id="m-cancel">취소</button>
      <button class="cbtn buy" id="m-save">저장</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="list-modal">
  <div class="modal">
    <h3>내 목표가 알림 목록</h3>
    <div id="al-list-body" class="al-list"></div>
    <button class="cbtn buy" id="l-close">닫기</button>
  </div>
</div>

<div class="modal-bg" id="fb-modal">
  <div class="modal">
    <h3>영역 수정 피드백</h3>
    <p id="fb-target" style="font-size:11.5px;color:#0F766E;font-weight:700"></p>
    <textarea id="fb-text" rows="3" placeholder="예: 이 행의 가격 글씨 조금 더 키워줘"></textarea>
    <div class="m-row">
      <button class="cbtn" id="fb-cancel">취소</button>
      <button class="cbtn buy" id="fb-save">메모 추가</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
