    $("secs-box").innerHTML=d.secs.map(s=>{

      if(!items.length)return "";
      return '<section class="sec"><h2 class="sec-h">'+s[0]+'</h2><div class="pgrid'+(s[1]===3?' g3':'')+'">'+items.map(it=>'<a class="pc" href="'+it[6]+'" target="_blank" referrerpolicy="unsafe-url"><div class="pi"><img src="'+src(it[1])+'" alt="'+it[2]+'"><span class="bdg'+(it[7]?' core':'')+'">'+it[0]+'</span></div><div class="pt"><h3>'+it[2]+'</h3><p>'+it[3]+'</p><div class="pp">'+(it[4]?'<em>'+it[4]+'</em>':'<span></span>')+'<b>'+it[5]+'</b></div></div></a>').join("")+'</div></section>';
    }).join("");
    $("notes-box").innerHTML='<div class="sec"><h2 class="sec-h">체감 · 사양 · 혹평 검증 노트</h2><div class="notes">'+d.notes.map(n=>'<div class="note"><b>'+n[0]+'</b>'+n[1]+'</div>').join("")+'</div></div>';
  }

  /* 1안 실시간 저장소 연동: /api/data/content 의 curatorDecks가 있으면 배포 없이 즉시 반영 */
  fetch("/api/data/content").then(r=>r.ok?r.json():null).then(res=>{
    var live=res&&res.value&&res.value.curatorDecks;
    if(live&&typeof live==="object"){
      Object.keys(live).forEach(k=>{DECKS[k]=live[k];});
      $("sync-msg").textContent="";
      render();
    }else{
      $("sync-msg").textContent="";
    }
  }).catch(()=>{$("sync-msg").textContent="";});

  qa("[data-d]").forEach(b=>b.onclick=()=>{cur=b.dataset.d;if(history.replaceState)history.replaceState(null,"","#"+cur);render();});
  $("qi").oninput=e=>{q=e.target.value.trim();render();};
  $("sh").onclick=e=>{var b=e.currentTarget;if(navigator.clipboard)navigator.clipboard.writeText(location.origin+location.pathname+"#"+cur);b.textContent="복사 완료 ✦";setTimeout(()=>b.textContent="현재 탭 링크 복사",1400);};
  render();
})();</script>
</body>
</html>
